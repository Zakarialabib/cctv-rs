[workspace]
resolver = "2"
# Listed explicitly, in publish order: a glob that stops matching (`crates/*`)
# fails the whole build with a confusing `failed to read` error, and this list is
# also the release order used by `scripts/publish.sh`.
members = [
    "crates/cctv-core",
    "crates/cctv-transport",
    "crates/cctv-rtp",
    "crates/cctv-rtsp",
    "crates/cctv-onvif",
    "crates/cctv-discovery",
    "crates/cctv-ezviz",
    "crates/cctv-hal-usb",
    "crates/cctv-agent",
    "crates/cctv-protocol-ptp",
    "crates/cctv-storage-msc",
    "crates/cctv-adapter-actioncam",
    "crates/cctv-rs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/Zakarialabib/cctv-rs"

[workspace.dependencies]
# --- workspace crates (path + version: Cargo strips `path` at publish time) ---
cctv-core = { path = "crates/cctv-core", version = "0.1.0" }
cctv-transport = { path = "crates/cctv-transport", version = "0.1.0" }
cctv-rtp = { path = "crates/cctv-rtp", version = "0.1.0" }
cctv-rtsp = { path = "crates/cctv-rtsp", version = "0.1.0" }
cctv-onvif = { path = "crates/cctv-onvif", version = "0.1.0" }
cctv-discovery = { path = "crates/cctv-discovery", version = "0.1.0" }
cctv-ezviz = { path = "crates/cctv-ezviz", version = "0.1.0" }
cctv-hal-usb = { path = "crates/cctv-hal-usb", version = "0.1.0" }
cctv-agent = { path = "crates/cctv-agent", version = "0.1.0" }
cctv-protocol-ptp = { path = "crates/cctv-protocol-ptp", version = "0.1.0" }
cctv-storage-msc = { path = "crates/cctv-storage-msc", version = "0.1.0" }
cctv-adapter-actioncam = { path = "crates/cctv-adapter-actioncam", version = "0.1.0" }
# The facade is published last: it re-exports every crate above.  It cannot be
# called `cctv` — that name is taken on crates.io by an unrelated project.
cctv-rs = { path = "crates/cctv-rs", version = "0.1.0" }

# --- external driver ---
# Published from its own repository (`ezviz-openapi-rs`). Development builds use
# the git dependency pinned to a reviewed rev; `cargo publish` strips `git` and
# resolves `version` from crates.io, so published crates depend on the release.
ezviz-openapi = { version = "0.1.0", git = "https://github.com/Zakarialabib/ezviz-openapi-rs", rev = "1994b4e6a5d02e16bcd66b124a9b1f2267ceb42a" }

# --- network (drivers only; never cctv-core) ---
# rustls only: native-tls is never linked (CI checks `cargo tree -i native-tls`).
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", default-features = false }
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
base64 = "0.23"
# The socket layer's TLS stack. `reqwest` above already resolves these majors,
# so enabling both `http` and `net` links one rustls, not two.
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pki-types = "1"

# --- error + async traits ---
# `thiserror` for the error taxonomy (no_std via `default-features = false`) and
# `async-trait` so a driver writes `async fn` instead of assembling boxed futures.
thiserror = { version = "2", default-features = false }
async-trait = "0.1"

# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only `cctv-core`'s `quirks` feature needs this: the quirks table is TOML so a
# new workaround is a reviewable data change rather than a code change.
toml = "0.8"

# --- dev ---
insta = { version = "1.42", features = ["json"] }
# Generates the self-signed certificate the `net` feature's TLS test serves, at
# test time: no checked-in key material, and the test proves the certificate is
# genuinely unverifiable rather than trusting a canned one.
rcgen = "0.13"

[workspace.lints.rust]
# A missing doc comment is a build failure, so the public device model cannot rot
# silently. Declared once here and inherited with `[lints] workspace = true`.
missing_docs = "deny"
