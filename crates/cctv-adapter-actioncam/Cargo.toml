[package]
name = "cctv-adapter-actioncam"
description = "ActionCam adapter for cctv-rs: passive mDNS TXT identification and status inspection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["actioncam", "insta360", "mdns", "cctv"]
categories = ["api-bindings", "multimedia::video"]

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["io-util", "net", "sync", "rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
