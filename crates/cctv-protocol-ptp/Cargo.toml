[package]
name = "cctv-protocol-ptp"
description = "Picture Transfer Protocol (PTP / ISO 15740 / PTP-IP) framing, session management, and mock responder for cctv-rs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ptp", "ptp-ip", "iso15740", "cctv", "camera"]
categories = ["multimedia::video", "network-programming"]

[dependencies]
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "sync", "rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "net", "time"] }

[lints]
workspace = true
