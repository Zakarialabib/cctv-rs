[package]
name = "cctv-driver"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Vendor-neutral driver extension point for cctv-rs"

[features]
default = ["discovery", "onvif"]
discovery = ["cctv-transport"]
driver-mock = []
mobile = ["discovery", "dep:tokio"]
onvif = ["cctv-transport", "dep:tokio", "dep:base64", "dep:sha1", "dep:serde_json"]

[dependencies]
cctv-core = { workspace = true }
cctv-transport = { workspace = true, features = ["http"], optional = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["sync", "time", "net", "rt", "macros"] }
base64 = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
futures-executor = "0.3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
cctv-transport = { workspace = true, features = ["fixture"] }
