[package]
name = "cctv-driver"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Vendor-neutral driver extension point for cctv-rs"

[features]
default = ["discovery"]
discovery = ["cctv-transport"]
driver-mock = []
mobile = ["discovery", "dep:tokio"]

[dependencies]
cctv-core = { workspace = true }
cctv-transport = { workspace = true, features = ["http"], optional = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["sync", "time", "net", "rt", "macros"] }

[dev-dependencies]
futures-executor = "0.3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
