[package]
name = "cctv-onvif"
description = "ONVIF (Device / Media / PTZ) driver for cctv-rs: SOAP 1.2 builders, WS-Security UsernameToken auth, a session over the shared HTTP client and a CameraBackend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["cctv", "onvif", "ptz", "soap", "camera"]
categories = ["api-bindings", "multimedia::video"]

[dependencies]
cctv-driver = { workspace = true, features = ["onvif"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
cctv-transport = { workspace = true, features = ["fixture"] }
cctv-core = { workspace = true }

[lints]
workspace = true
