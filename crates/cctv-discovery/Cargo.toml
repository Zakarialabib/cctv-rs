[package]
name = "cctv-discovery"
description = "Camera discovery for cctv-rs: SSDP M-SEARCH and WS-Discovery sweeps over UDP multicast."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["cctv", "camera", "ssdp", "discovery", "onvif"]
categories = ["network-programming", "hardware-support"]

[features]
mobile = ["dep:tokio"]

[dependencies]
cctv-core.workspace = true
# Only the shared, prefix-agnostic XML scanner (no `http` feature): WS-Discovery
# replies are read with it, and nothing here opens a TCP connection.
cctv-transport = { workspace = true, features = ["http"] }
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["sync", "time", "net", "rt", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
