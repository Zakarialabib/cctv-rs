[package]
name = "cctv-discovery"
description = "Camera discovery for cctv-rs: SSDP M-SEARCH and WS-Discovery sweeps over UDP multicast."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["cctv", "camera", "ssdp", "discovery", "onvif"]
categories = ["network-programming", "hardware-support"]

[dependencies]
cctv-core.workspace = true
# Only the shared, prefix-agnostic XML scanner (no `http` feature): WS-Discovery
