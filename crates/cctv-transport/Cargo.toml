[package]
name = "cctv-transport"
description = "TLS policy, budgeted frame reader, XML scanner and Digest-capable HTTP transport for cctv-rs drivers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["cctv", "rtsp", "tls", "digest-auth", "streaming"]
categories = ["multimedia::video", "network-programming"]

[features]
default = []
# The async HTTP client (reqwest + rustls) the drivers share. Digest / Basic are
# computed in `digest`, which is always compiled, so `http` is the client only.
http = ["dep:reqwest"]
# A canned-response HTTP server for driver tests. Pulls tokio's network stack.
fixture = ["dep:tokio"]
# The raw socket layer: TCP, UDP and rustls TLS with the crate's policy applied.
# Off by default so a driver that never opens a socket does not link tokio's
# network stack. Deliberately free of `http`: this is what replaces it.
net = ["dep:tokio", "dep:tokio-rustls", "dep:rustls", "dep:rustls-pki-types"]

[dependencies]
# Policy is data: pinned certs, minimum TLS version, ALPN preference.
serde.workspace = true
reqwest = { workspace = true, optional = true }
# Digest is always compiled (see `digest`): a pure header computation that an
# RTSP client needs and must not have to link `reqwest` for.
md-5.workspace = true
sha2.workspace = true
base64.workspace = true
tokio = { workspace = true, optional = true, features = ["net", "io-util", "rt", "time"] }
# rustls only: native-tls is never linked (CI checks `cargo tree -i native-tls`).
# Both are pinned to the majors `reqwest` already resolves, so the `http` and
# `net` features share one rustls instead of two.
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
# Generates the self-signed certificate the TLS test serves, at test time.
rcgen = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
