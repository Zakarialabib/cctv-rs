[package]
name = "cctv-rs"
description = "Facade over the cctv-rs workspace: discovery, frames, PTZ, stats and fleet reconciliation behind one API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["cctv", "camera", "facade", "ptz", "signage"]
categories = ["multimedia", "hardware-support"]

[features]
default = []
ddc = ["cctv-driver/ddc", "cctv-agent/ddc"]

[dependencies]
cctv-core.workspace = true
cctv-driver = { workspace = true, features = ["discovery", "ezviz", "uvc", "uvc-ptp"] }
cctv-rtp.workspace = true
cctv-agent.workspace = true
# Zone / detection device model behind the facade's zone surface.
cctv-detect.workspace = true
cctv-rag.workspace = true
cctv-pair.workspace = true
cctv-sync.workspace = true
cctv-onvif.workspace = true
# `http` carries the shared rustls client the ONVIF factory hands to its session.
cctv-transport = { workspace = true, features = ["http"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }

[dev-dependencies]
# The facade's tests define a failing `CameraBackend`, which is an `async-trait`
# trait and needs the attribute macro.
async-trait.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
cctv-driver = { workspace = true, features = ["driver-mock", "discovery", "ezviz", "uvc", "uvc-ptp"] }

[lints]
workspace = true
