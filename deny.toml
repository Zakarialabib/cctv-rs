# cargo-deny configuration.
#
# The point is not "no advisories ever" — it is that a network-facing crate must not
# ship a dependency with a known hole without a recorded decision.

[advisories]
yanked = "warn"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    # Root-certificate *data*, not code: webpki-roots.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path-only dependencies inside the workspace carry a `version` as well, so that
# this deny rule stays meaningful at publish time.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
